<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#023246"><title>My STS account</title><link href="styles.css" rel="stylesheet"><style>.customer-page{max-width:1100px;margin:0 auto;padding:58px 28px 90px}.customer-welcome{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:32px}.customer-welcome h1{font-size:clamp(34px,4vw,52px);margin:12px 0}.account-panel{background:#fff;border:1px solid #d4d4ce;border-radius:14px;padding:24px;margin-bottom:22px;box-shadow:0 18px 40px #02324610}.account-details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.account-details small{display:block;color:#6a7c84;font-size:11px;text-transform:uppercase;letter-spacing:1px}.account-details strong{display:block;overflow-wrap:anywhere;margin-top:5px}.enquiry-row{padding:18px 0;border-bottom:1px solid #e1e7e9;display:grid;grid-template-columns:1fr auto;gap:14px}.enquiry-row:last-child{border-bottom:0}.enquiry-row h3{margin:0 0 5px;font-size:16px}.enquiry-meta{font-size:12px;color:#607782}.status-pill{display:inline-block;border-radius:999px;padding:4px 10px;background:#e2f7f0;color:#075d4d;font-size:11px;font-weight:800}.logout-button{border:1px solid #c7d6dc;border-radius:999px;background:white;padding:10px 16px;color:#023246;font-weight:800;cursor:pointer}.empty-account{padding:30px;text-align:center;color:#617782;background:#f5f8f9;border-radius:10px}@media(max-width:650px){.account-details{grid-template-columns:1fr}.customer-welcome{display:block}.logout-button{margin-top:10px}.enquiry-row{grid-template-columns:1fr}}</style></head><body class="page-enter"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><img src="assets/sts-logo.png" alt="STS logo"></span><span class="brand-copy"><strong>STS<span>.</span></strong><small>SMART TECHNICAL SERVICES</small></span></a><div class="header-account-actions"><a class="account-login account-login-icon-only" href="auth.html" aria-label="Log in" title="Log in"><img src="assets/customer-login-icon.png" alt="" aria-hidden="true"></a><button class="site-search-toggle" type="button" aria-label="Open site search" aria-expanded="false" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 4.2 4.2"></path></svg></button></div></header><main class="customer-page"><div class="customer-welcome"><div><p class="eyebrow">CUSTOMER PORTAL</p><h1>Welcome, <span id="customerName">Customer</span>.</h1><p>Review your account details and track enquiries you’ve submitted to STS.</p></div><button class="logout-button" id="logoutButton">Log out ↗</button></div><section class="account-panel"><h2>My details</h2><div class="account-details" id="accountDetails"></div></section><section class="account-panel"><div class="panel-heading"><div><p class="eyebrow">YOUR REQUESTS</p><h2>My enquiries</h2><p>Enquiries submitted using your registered email appear here.</p></div><a class="button button-primary" href="contact.html">New enquiry ↗</a></div><div id="myEnquiries"></div></section></main><script>
function getJSON(k,fb){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fb))}catch{return fb}}const sess=getJSON('sts_customer_session',null);if(!sess||!sess.email){location.replace('auth.html');}else{const account=getJSON('sts_customer_accounts',[]).find(a=>a.email.toLowerCase()===sess.email.toLowerCase());if(!account){localStorage.removeItem('sts_customer_session');location.replace('auth.html')}else{document.getElementById('customerName').textContent=account.name.split(' ')[0];document.getElementById('accountDetails').innerHTML=`<div><small>Full name</small><strong>${esc(account.name)}</strong></div><div><small>Email</small><strong>${esc(account.email)}</strong></div><div><small>Phone</small><strong>${esc(account.phone||'—')}</strong></div><div><small>Company</small><strong>${esc(account.company||'Individual')}</strong></div><div><small>Member since</small><strong>${account.createdAt?new Date(account.createdAt).toLocaleDateString():'—'}</strong></div>`;const rows=getJSON('sts_customer_enquiries',[]).filter(e=>String(e.email||'').toLowerCase()===account.email.toLowerCase()).sort((a,b)=>String(b.submittedAt).localeCompare(String(a.submittedAt)));document.getElementById('myEnquiries').innerHTML=rows.length?rows.map(e=>`<article class="enquiry-row"><div><h3>${esc(e.subject||('Enquiry about '+(e.service||'STS services')))}</h3><div class="enquiry-meta">${esc(e.service||'General enquiry')} · ${new Date(e.submittedAt).toLocaleString()}</div><p>${esc(e.message||'No additional details provided.')}</p></div><div><span class="status-pill">${esc(e.status||'Submitted')}</span><details style="margin-top:10px"><summary style="cursor:pointer;color:#287094;font-size:12px;font-weight:800">View enquiry</summary><p>${esc(e.message||'No additional details provided.')}</p><p class="enquiry-meta">Reference: ${esc(e.id||'Pending')}</p></details></div></article>`).join(''):'<div class="empty-account">You have not submitted any enquiries using this email yet. <a href="contact.html" style="color:#287094;font-weight:800">Send an enquiry ↗</a></div>'}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}document.getElementById('logoutButton').onclick=()=>{localStorage.removeItem('sts_customer_session');location.href='index.html'};
</script></body></html>
